<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기상청 단기예보 테스트</title>
  <style>
    :root { --blue: #1976d2; --bg: #f2f7fc; --line: #d9e4ef; --text: #1d2b3a; --muted: #6b7c8d; --red: #d32f2f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { margin: 0 0 0.3rem; }
    .sub { color: var(--muted); margin: 0 0 1.2rem; font-size: 0.9rem; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select, button { font: inherit; }
    input, select { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
    input[readonly] { background: var(--bg); }
    button { padding: 0.55rem 1rem; border: 0; border-radius: 8px; background: var(--blue); color: #fff; cursor: pointer; }
    button:hover { background: #1259a3; }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.alt { background: #fff; color: var(--blue); border: 1px solid var(--blue); width: 100%; }
    button.alt:hover { background: #e3f0fd; }
    .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; align-items: end; }
    .full { grid-column: 1 / -1; }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .tabs button { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .tabs button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.6rem; }
    .now { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; }
    .stat { background: var(--bg); border-radius: 10px; padding: 0.8rem; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; margin-top: 0.2rem; }
    .stat span { font-size: 0.8rem; color: var(--muted); }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.88rem; white-space: nowrap; }
    th, td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); text-align: center; }
    th { background: var(--bg); position: sticky; top: 0; }
    td:first-child, th:first-child { text-align: left; }
    .err { color: var(--red); white-space: pre-wrap; word-break: break-all; font-size: 0.88rem; }
    details { margin-top: 0.8rem; font-size: 0.8rem; }
    pre { background: #0f1b2a; color: #cfe3ff; padding: 0.8rem; border-radius: 8px; overflow: auto; max-height: 300px; }
  </style>
</head>
<body>
  <main>
    <h1>🌤️ 기상청 단기예보 테스트</h1>
    <p class="sub">공공데이터포털 「기상청_단기예보 ((구)_동네예보) 조회서비스」 · 인증키는 서버(Vercel)에서 관리돼요</p>

    <form id="form" class="panel form">
      <div>
        <label for="place">지역 검색 (도시 이름)</label>
        <input id="place" list="placeList" placeholder="예: 제주시, 부산, 강릉" autocomplete="off">
        <datalist id="placeList"></datalist>
      </div>
      <div>
        <label>&nbsp;</label>
        <button type="button" id="geo" class="alt">📍 내 위치로</button>
      </div>
      <div>
        <label for="lat">위도</label>
        <input id="lat" type="number" step="any" required>
      </div>
      <div>
        <label for="lon">경도</label>
        <input id="lon" type="number" step="any" required>
      </div>
      <div>
        <label for="gridView">격자 (자동 계산)</label>
        <input id="gridView" readonly>
        <input id="nx" type="hidden">
        <input id="ny" type="hidden">
      </div>
      <div><button id="go" type="submit">조회하기</button></div>
      <div class="full meta" id="geoMsg"></div>
    </form>

    <div id="result"></div>
  </main>

  <script>
    const PLACES = [
      ['서울', 37.5665, 126.9780], ['부산', 35.1796, 129.0756], ['대구', 35.8714, 128.6014], ['인천', 37.4563, 126.7052],
      ['광주', 35.1595, 126.8526], ['대전', 36.3504, 127.3845], ['울산', 35.5384, 129.3114], ['세종', 36.4800, 127.2890],
      ['수원', 37.2636, 127.0286], ['성남', 37.4200, 127.1267], ['고양', 37.6584, 126.8320], ['용인', 37.2411, 127.1776],
      ['춘천', 37.8813, 127.7298], ['원주', 37.3422, 127.9202], ['강릉', 37.7519, 128.8761], ['속초', 38.2070, 128.5918],
      ['청주', 36.6424, 127.4890], ['천안', 36.8151, 127.1139], ['전주', 35.8242, 127.1480], ['군산', 35.9676, 126.7369],
      ['목포', 34.8118, 126.3922], ['여수', 34.7604, 127.6622], ['순천', 34.9506, 127.4872], ['포항', 36.0190, 129.3435],
      ['경주', 35.8562, 129.2247], ['안동', 36.5684, 128.7294], ['창원', 35.2281, 128.6811], ['진주', 35.1800, 128.1076],
      ['제주시', 33.4996, 126.5312], ['서귀포시', 33.2541, 126.5601], ['성산', 33.4580, 126.9420],
      ['울릉도', 37.4845, 130.9057], ['독도', 37.2426, 131.8597],
    ]
    const SERVICES = {
      ncst: { name: '초단기실황', desc: '지금 관측값 (매시 40분 이후 제공)' },
      fcst: { name: '초단기예보', desc: '앞으로 6시간 (매시 45분 이후 제공)' },
      vilage: { name: '단기예보', desc: '앞으로 3일 (하루 8회 발표)' },
    }
    const LABEL = {
      T1H: ['기온', '℃'], TMP: ['기온', '℃'], TMN: ['최저기온', '℃'], TMX: ['최고기온', '℃'],
      REH: ['습도', '%'], RN1: ['1시간 강수', ''], PCP: ['1시간 강수', ''], POP: ['강수확률', '%'],
      WSD: ['풍속', 'm/s'], VEC: ['풍향', '°'], SKY: ['하늘', ''], PTY: ['강수형태', ''],
      SNO: ['적설', ''], UUU: ['동서바람', 'm/s'], VVV: ['남북바람', 'm/s'], WAV: ['파고', 'M'], LGT: ['낙뢰', ''],
    }
    const SKY = { 1: '☀️ 맑음', 3: '⛅ 구름많음', 4: '☁️ 흐림' }
    const PTY = { 0: '없음', 1: '🌧️ 비', 2: '🌨️ 비/눈', 3: '❄️ 눈', 4: '🌦️ 소나기', 5: '💧 빗방울', 6: '🌨️ 빗방울눈날림', 7: '🌨️ 눈날림' }

    const $ = (s) => document.querySelector(s)
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    let mode = 'ncst'
    let lastRaw = null

    // 기상청 격자 변환 (Lambert Conformal Conic, 5km 격자)
    function toGrid(lat, lon) {
      const D = Math.PI / 180
      const re = 6371.00877 / 5.0
      const slat1 = 30 * D, slat2 = 60 * D, olon = 126 * D, olat = 38 * D
      let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5)
      sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn)
      let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5)
      sf = (Math.pow(sf, sn) * Math.cos(slat1)) / sn
      let ro = Math.tan(Math.PI * 0.25 + olat * 0.5)
      ro = (re * sf) / Math.pow(ro, sn)
      let ra = Math.tan(Math.PI * 0.25 + lat * D * 0.5)
      ra = (re * sf) / Math.pow(ra, sn)
      let theta = lon * D - olon
      if (theta > Math.PI) theta -= 2 * Math.PI
      if (theta < -Math.PI) theta += 2 * Math.PI
      theta *= sn
      return {
        x: Math.floor(ra * Math.sin(theta) + 43 + 0.5),
        y: Math.floor(ro - ra * Math.cos(theta) + 136 + 0.5),
      }
    }

    $('#placeList').innerHTML = PLACES.map(([n]) => `<option value="${esc(n)}"></option>`).join('')

    function applyLatLon() {
      const lat = parseFloat($('#lat').value)
      const lon = parseFloat($('#lon').value)
      if (isNaN(lat) || isNaN(lon)) { $('#gridView').value = ''; return false }
      if (lat < 32 || lat > 40 || lon < 124 || lon > 133) {
        $('#gridView').value = ''
        $('#geoMsg').textContent = '⚠️ 대한민국 범위(위도 32~40, 경도 124~133) 밖이에요.'
        return false
      }
      const g = toGrid(lat, lon)
      $('#nx').value = g.x
      $('#ny').value = g.y
      $('#gridView').value = `X ${g.x}, Y ${g.y}`
      return true
    }
    function setLatLon(lat, lon, msg) {
      $('#lat').value = (+lat).toFixed(4)
      $('#lon').value = (+lon).toFixed(4)
      $('#geoMsg').textContent = msg || ''
      applyLatLon()
    }

    $('#place').addEventListener('input', () => {
      const hit = PLACES.find(([n]) => n === $('#place').value.trim())
      if (hit) setLatLon(hit[1], hit[2], `📍 ${hit[0]} 기준 좌표`)
    })
    $('#lat').addEventListener('input', () => { $('#geoMsg').textContent = ''; applyLatLon() })
    $('#lon').addEventListener('input', () => { $('#geoMsg').textContent = ''; applyLatLon() })
    $('#geo').addEventListener('click', () => {
      if (!navigator.geolocation) return ($('#geoMsg').textContent = '이 브라우저는 위치 기능을 지원하지 않아요.')
      $('#geoMsg').textContent = '위치를 확인하는 중… (브라우저의 위치 허용을 눌러주세요)'
      navigator.geolocation.getCurrentPosition(
        (pos) => { $('#place').value = ''; setLatLon(pos.coords.latitude, pos.coords.longitude, '📍 내 위치를 불러왔어요') },
        (err) => ($('#geoMsg').textContent = '위치를 가져오지 못했어요: ' + err.message),
        { timeout: 10000 }
      )
    })

    setLatLon(33.4996, 126.5312, '📍 제주시 기준 좌표')
    $('#place').value = '제주시'

    async function call(kind) {
      const q = new URLSearchParams({ kind, nx: $('#nx').value, ny: $('#ny').value })
      let res
      try {
        res = await fetch('/api/weather?' + q)
      } catch (e) {
        throw new Error('서버에 연결하지 못했어요. 네트워크를 확인하세요.\n' + e.message)
      }
      const text = await res.text()
      lastRaw = text
      let json
      try { json = JSON.parse(text) } catch {
        throw new Error(`API 응답을 읽지 못했어요 (HTTP ${res.status}). Vercel Root Directory 설정과 /api/weather 배포 여부를 확인하세요.\n` + text.slice(0, 300))
      }
      if (json.error) throw new Error(json.error + (json.detail ? '\n' + json.detail : ''))

      const { base, data } = json
      const gate = data.OpenAPI_ServiceResponse?.cmmMsgHeader
      if (gate) throw new Error(`인증/요청 오류 ${gate.returnReasonCode ?? ''}: ${gate.returnAuthMsg ?? gate.errMsg}\n(${gate.errMsg})`)
      const head = data.response?.header
      if (!head || head.resultCode !== '00') throw new Error(`API 오류 ${head?.resultCode ?? ''}: ${head?.resultMsg ?? '알 수 없음'}`)
      const items = data.response.body?.items?.item ?? []
      return { base, items: Array.isArray(items) ? items : [items] }
    }

    function fmt(cat, v) {
      if (cat === 'SKY') return SKY[v] ?? v
      if (cat === 'PTY') return PTY[v] ?? v
      const u = LABEL[cat]?.[1] ?? ''
      return esc(v) + (u && !/[가-힣]/.test(String(v)) ? u : '')
    }

    const fmtBase = (b) => `${b.date.slice(0, 4)}-${b.date.slice(4, 6)}-${b.date.slice(6)} ${b.time.slice(0, 2)}:${b.time.slice(2)}`

    function renderNcst({ base, items }) {
      const order = ['T1H', 'REH', 'RN1', 'WSD', 'VEC', 'PTY']
      const map = Object.fromEntries(items.map((i) => [i.category, i.obsrValue]))
      const stats = order.filter((c) => c in map).map((c) =>
        `<div class="stat"><span>${LABEL[c][0]}</span><b>${fmt(c, map[c])}</b></div>`).join('')
      return `<div class="meta">발표 ${fmtBase(base)}</div><div class="now">${stats}</div>`
    }

    function renderFcst({ base, items }) {
      const cats = [...new Set(items.map((i) => i.category))]
      const slots = [...new Set(items.map((i) => i.fcstDate + i.fcstTime))].sort()
      const by = {}
      items.forEach((i) => { (by[i.fcstDate + i.fcstTime] ??= {})[i.category] = i.fcstValue })
      const head = cats.map((c) => `<th>${esc(LABEL[c]?.[0] ?? c)}</th>`).join('')
      const rows = slots.map((s) => {
        const label = `${s.slice(4, 6)}/${s.slice(6, 8)} ${s.slice(8, 10)}:${s.slice(10, 12)}`
        return `<tr><td>${label}</td>${cats.map((c) => `<td>${by[s][c] === undefined ? '-' : fmt(c, by[s][c])}</td>`).join('')}</tr>`
      }).join('')
      return `<div class="meta">발표 ${fmtBase(base)} · ${slots.length}개 시각</div>
        <div class="scroll"><table><tr><th>시각</th>${head}</tr>${rows}</table></div>`
    }

    function shell(inner) {
      const tabs = Object.entries(SERVICES).map(([k, s]) =>
        `<button type="button" class="${mode === k ? 'on' : ''}" data-mode="${k}">${s.name}</button>`).join('')
      return `<div class="panel"><div class="tabs">${tabs}</div>
        <div class="meta">${SERVICES[mode].desc}</div>${inner}
        ${lastRaw ? `<details><summary>원본 응답 보기</summary><pre>${esc(lastRaw.slice(0, 20000))}</pre></details>` : ''}</div>`
    }

    async function search() {
      const btn = $('#go')
      btn.disabled = true
      $('#result').innerHTML = shell('<div class="meta">불러오는 중…</div>')
      try {
        const data = await call(mode)
        if (!data.items.length) throw new Error('데이터가 없어요. 격자 좌표와 발표 시각을 확인하세요.')
        $('#result').innerHTML = shell(mode === 'ncst' ? renderNcst(data) : renderFcst(data))
      } catch (e) {
        $('#result').innerHTML = shell(`<div class="err">${esc(e.message)}</div>`)
      } finally {
        btn.disabled = false
      }
    }

    $('#form').addEventListener('submit', (e) => {
      e.preventDefault()
      if (!applyLatLon()) return
      search()
    })

    $('#result').addEventListener('click', (e) => {
      const b = e.target.closest('[data-mode]')
      if (!b) return
      mode = b.dataset.mode
      lastRaw = null
      $('#form').requestSubmit()
    })
  </script>
</body>
</html>
